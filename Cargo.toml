[workspace]
resolver = "3"
members = [
    "crates/redm-core",
    "crates/redm-env",
    "crates/redm-runtime",
    "crates/redm-logs",
    "crates/redm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lgriffith10/redm-linux"

[workspace.dependencies]
redm-core = { path = "crates/redm-core" }
redm-env = { path = "crates/redm-env" }
redm-runtime = { path = "crates/redm-runtime" }
redm-logs = { path = "crates/redm-logs" }

anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
